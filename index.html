<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Mania</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="site-title">Movie-Mania</h1>
        <div class="switch-wrapper">
            <input type="checkbox" id="theme-toggle" />
            <label for="theme-toggle" class="switch-label">
                <span class="switch-button"></span>
            </label>

        </div>

         <!--<button id="theme-toggle">Toggle Dark/Light Mode</button>-->
    </header>
    <div class="container">
        <div class="search">
            <input type="text" id="search-input" placeholder="Search Movie..." autocomplete="off">
            <button id="search-button">Search</button>
        </div>
        <div class="loading-spinner" id="loading-spinner"></div>
        <div class="error-message" id="error-message"></div>
       
        <div class="movies-container trending">
            <h1>Trending Movies</h1>
            <div class="movies-grid" id="trending-movies"></div>
        </div>
       
        <div class="movies-container categories">
            <h1>Categories</h1>
            <div class="category-buttons">
                <button class="category-button" data-genre="28">Action</button>
                <button class="category-button" data-genre="35">Comedy</button>
                <button class="category-button" data-genre="18">Drama</button>
                
            </div>
            <div class="movies-grid" id="category-movies">
                
            </div>
        </div>

        <div class="movies-container watchlist">
            <h1>Watchlist</h1>
            <div class="movies-grid" id="watchlist-movies">
                
            </div>
        </div>
    </div>
    
    <div id="movieDetails" class="movie-details-popup">
        <div id="movieDetails" class="movie-details-popup"></div>
    </div>

  <div class="popup-container" id="popup-container"></div>


    <script src="script.js"></script>
</body>
</html>
